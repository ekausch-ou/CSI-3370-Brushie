<!-- Size Card -->
<style>
    #sizePreview {
        font-size: 2px;
    }
</style>
<div class="card section-card d-none d-md-block" style="min-width: 85px;">
    <div class="card-body pt-0 d-flex flex-column justify-content-between h-100">
        <div class="section-title card-title text-center py-1">Size</div>
        <button
            id="sizeBtn"
            class="btn p-2 pb-1 d-flex flex-column align-items-center justify-content-between"
            style="aspect-ratio: 1/1;"
            data-bs-toggle="popover"
            data-bs-html="true"
            data-bs-placement="right"
        >
            <i id="sizePreview" class="bi bi-circle-fill"></i>
            <i class="bi bi-chevron-compact-down fs-6"></i>
        </button>
    </div>
</div>
<script>
// =========================================
// Size Popover
// =========================================
const popoverContent = `
    <div class="d-flex flex-column gap-2" style="width: 180px;">
        <label class="small mb-0">size Size</label>
        <input type="range" class="form-range" min="1" max="32" value="2" id="sizeSlider">
        <div class="text-center">
            <span id="sizeValue">2</span> px
        </div>
    </div>
`;

// Create popover
const sizeBtn = document.getElementById('sizeBtn');

const popover = new bootstrap.Popover(sizeBtn, {
    content: popoverContent,
    sanitize: false,
    trigger: 'click'
});


// =========================================
// Close on outside click
// =========================================
document.addEventListener("click", (e) => {
    const pop = document.querySelector(".popover");
    if (!pop) return;

    // If click is outside both trigger and popover
    if (
        !pop.contains(e.target) &&
        !sizeBtn.contains(e.target)
    ) {
        popover.hide();
    }
});


// Update slider after popover opens
sizeBtn.addEventListener('shown.bs.popover', () => {
    const slider = document.getElementById('sizeSlider');
    const valueLabel = document.getElementById('sizeValue');
    const preview = document.getElementById('sizePreview');

    const updateSize = () => {
        const size = parseInt(slider.value);

        valueLabel.textContent = size;
        preview.style.fontSize = `${size}px`;

        window.engine.setLineWidth(size);
    };

    updateSize();

    slider.oninput = updateSize;
});
</script>
