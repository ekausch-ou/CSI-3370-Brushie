<style>
    /* General Formating */
    .section-title {
        font-size: 12px;
    }
    .section-card {
        height: 110px;
    }
    .drawing-toolbar .btn:hover {
        background-color: #f0f0f0;
        border: 1px solid #a5a3a3;
    }
    .btn.selected {
        background-color: #e0e1fa;
        outline: 1px solid #0d6efd;
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
<div class="container-fluid mt-4 m-0 px-0 w-100">
    <div class="drawing-toolbar d-flex gap-1">
        {% include 'toolbar/selection-card.html'%}
        {% include 'toolbar/image-card.html'%}
        {% include 'toolbar/tools-card.html'%}
        {% include 'toolbar/brushes-card.html'%}
        {% include 'toolbar/shapes-card.html'%}
        {% include 'toolbar/colors-card.html'%}
        <!-- Mobile-only card -->
        <div class="card d-block d-md-none">
            <div class="card-body">
                <h5 class="card-title">Mobile Card</h5>
                <p class="card-text"></p>
            </div>
        </div>

        <!-- Layer Card -->
        <div class="card section-card d-none d-md-block">
            <div class="card-body pt-0">
                <div class="section-title card-title text-center py-1">Layers</div>
                <button class="btn p-2 pb-1 d-flex flex-column" style="aspect-ratio: 1/1;">
                    <i class="bi bi-stack fs-2"></i>
                </button>
            </div>
        </div>

        <!-- Fill Remiaining Space -->
        <div class="card section-card flex-grow-1">
            <div class="card-body">
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    // =========================================
    // General Button Selected
    // =========================================   
    const buttons = document.querySelectorAll(".btn-selectable");
    buttons.forEach(btn => {
        btn.addEventListener("click", () => {
            // remove selected from all
            buttons.forEach(b => b.classList.remove("selected"));

            // add selected to clicked one
            btn.classList.add("selected");
            btn.blur();
        });
    });
});
</script>
