{% load static %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<html>
    <head>
        {% include 'elements/includes.html' %}
        <title>Brushie</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body {
                background: #cbd9f8 !important;
            }
            .card {
                display: flex;
                flex-direction: column;
                height: 100%;
            }

            .card-body {
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        {% include 'elements/navbar.html' with active="home" %}
        <div class="d-flex flex-column" style="height: calc(100vh - 60px);">
            <div class="d-flex flex-column container-fluid h-100">                           
                {% include 'elements/tool-bar-card.html'%}
                <div class="card p-0 my-3 h-100">
                    <div class="card-body p-0 h-100">
                        <canvas id="drawing-canvas" style="width:100%; height:100%; display:block; overflow:hidden;"></canvas>
                    </div>
                </div>
            </div>

        </div>
        <script type="module" src="{% static 'frontend/app.js' %}"></script>
    </body>
</html>
<script>
    const canvas = document.getElementById("drawing-canvas");
    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();

        canvas.width = rect.width;
        canvas.height = rect.height;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
</script>
