{% load static %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<html>
    <head>
        {% include 'elements/includes.html' %}
        <title>Brushie</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            .bg-color {
                background: #cbd9f8 !important;
            }

            .card-body {
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }

            #canvas-container {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            #canvas-container canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
            }

            #bg-canvas {
                z-index: 0;
            }

            #drawing-canvas {
                z-index: 1;
            }

            #overlay-canvas {
                z-index: 2;
            }
        </style>
        <script>
            window.engine = null;
        </script>
    </head>
    <body class="bg-color">
        {% include 'elements/navbar.html' with active="home" %}
        <div class="d-flex flex-column" style="height: calc(100vh - 60px);">
            <div class="d-flex flex-column container-fluid h-100">
                {% include 'elements/menu-bar.html'%}
                {% include 'elements/tool-bar-card.html'%}
                <div class="card p-0 my-3 h-100">
                    <div id="canvas-container" class="card-body p-0 h-100">
                        <canvas id="bg-canvas"></canvas>
                        <canvas id="drawing-canvas"></canvas>
                        <canvas id="overlay-canvas"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="{% static 'frontend/app.js' %}"></script>
    </body>
</html>
